name: CI/CD Pipeline & Automated Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Verify Docker Container Build
        run: |
          docker build -t ai-search-engine:test -f docker/Dockerfile .

  version-and-release:
    name: Automated Semantic Versioning & Tagging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Auto Version Tag
        uses: paulhatch/semantic-version@v5.4.0
        id: cz
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          patch_pattern: "fix:"
          format: "${major}.${minor}.${patch}"

      - name: Create and Push Git Version Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.cz.outputs.version }}"
          echo "Creating Tag: $TAG"
          git tag -a "$TAG" -m "Automated CI/CD Release $TAG" || echo "Tag $TAG exists"
          git push origin "$TAG" || echo "Tag pushed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
